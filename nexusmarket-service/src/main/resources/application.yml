spring:
  application:
    name: nexusmarket-service
  datasource:
    url: jdbc:h2:mem:nexusmarket;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

nexusmarket:
  invoicing:
    tax-rate: 0.19

logging:
  level:
    com.nexusmarket: INFO
